name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
            archive: garf-windows-x64.zip
          - os: ubuntu-latest
            runtime: linux-x64
            archive: garf-linux-x64.tar.gz
          - os: macos-latest
            runtime: osx-arm64
            archive: garf-macos-arm64.tar.gz
          - os: macos-13
            runtime: osx-x64
            archive: garf-macos-x64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Runtime ${{ matrix.runtime }} -OutputDir dist

      - name: Package binary (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x ./scripts/package.sh
          ./scripts/package.sh ${{ matrix.runtime }} Release dist

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.runtime }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: package-*
          merge-multiple: true

      - name: Consolidate Checksums
        shell: bash
        run: |
          cd release-assets
          cat checksums.txt | sort -u > CHECKSUMS.txt || true
          rm -f checksums.txt
          sha256sum *.* >> CHECKSUMS.txt || true
          sort -u -k2,2 CHECKSUMS.txt -o CHECKSUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
          generate_release_notes: true
